<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cute Notes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>✨ My Notes ✨</h1>
    <div class="dark-mode-toggle">
      <span class="toggle-label">Dark Mode</span>
      <label class="switch">
        <input type="checkbox" id="darkModeToggle" />
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <div class="container">
    <div class="note-input-container">
      <input type="text" id="noteTitle" placeholder="Note Title ✏️" />
      <textarea id="noteBody" placeholder="Write your heart out... 💖"></textarea>
      <div class="note-actions">
        <button id="saveNoteBtn"><i class="fas fa-save"></i> Save Note</button>
        <button id="showNotesBtn"><i class="fas fa-book-open"></i> My Saved Notes</button>
      </div>
    </div>

    <div id="notesContainer" class="hidden">
      <div class="notes-header">
        <h2><i class="fas fa-bookmark"></i> Saved Notes</h2>
        <button id="closeNotesBtn"><i class="fas fa-times"></i></button>
      </div>
      <div id="notesList"></div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
